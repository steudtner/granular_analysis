name: CI

on:
  push:
    branches: [main, "checkpoint-**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install TeX Live (Computer Modern plots)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended cm-super dvipng

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src/granular_analysis tests

      - name: Tests
        run: python -m pytest -q 2>&1 | tee pytest.log; exit ${PIPESTATUS[0]}

      - name: Publish test log on failure
        if: failure()
        run: |
          git config user.name "ci-log-bot"
          git config user.email "ci-log-bot@users.noreply.github.com"
          git checkout --detach
          git add -f pytest.log
          git commit -m "CI test log for ${{ github.sha }}"
          git push -f origin HEAD:ci-logs
