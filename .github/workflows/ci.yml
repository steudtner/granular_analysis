name: CI

on:
  push:
    branches: [main, "checkpoint-**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install TeX Live (Computer Modern plots)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended cm-super dvipng

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src/granular_analysis tests

      - name: Tests
        run: python -m pytest -q 2>&1 | tee pytest.log; exit ${PIPESTATUS[0]}

      - name: Show test failures in job summary
        if: failure()
        run: |
          grep -E "^(FAILED|ERROR)" pytest.log | head -40 | while IFS= read -r line; do
            echo "::error::$line"
          done
          {
            echo "### pytest output (tail)"
            echo '```'
            tail -n 120 pytest.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
