[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "granular-analysis"
version = "0.1.0"
dependencies = [
    "numpy", "pandas", "matplotlib", "shapely", 
    "alphashape", "scipy", "trimesh", "scikit-learn"
]

[tool.setuptools.packages.find]
where = ["."]
